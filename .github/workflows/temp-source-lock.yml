name: Temporary source extractor lockfile resolution

on:
  push:
    branches: [feat/capability-archive-extraction]
    paths:
      - .github/workflows/temp-source-lock.yml
      - crates/prep-core/Cargo.toml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Generate dependency lockfile output for review
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo PREP_LOCK_BEGIN
          cat Cargo.lock
          echo PREP_LOCK_END
